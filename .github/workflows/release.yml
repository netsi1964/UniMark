name: Release Electron App
# Navn på workflowet (vises i GitHub Actions UI)

on:
  workflow_dispatch:
    # Gør workflowet manuelt triggerbart
    # fx via GitHub UI eller `gh workflow run`
    inputs:
      version:
        description: "Release version (fx v0.1.0)"
        required: true

jobs:
  # Job 1: Opretter GitHub Release én gang (ingen matrix)
  create-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version }}
          name: UniMark ${{ inputs.version }}
          draft: false
          prerelease: false

  # Job 2: Bygger på alle platforme og uploader til eksisterende release
  build:
    needs: create-release
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write

    strategy:
      matrix:
        # De tre officielle GitHub runners
        os:
          - macos-latest
          - windows-latest
          - ubuntu-latest

    steps:
      # 1. Henter repoets kode
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Installerer Node.js (samme version overalt)
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # 3. Installerer dependencies fra package-lock.json
      # npm ci er hurtigere og deterministisk i CI
      - name: Install dependencies
        run: npm ci

      # 4. Bygger web-komponenten først (kræves af Electron-build)
      - name: Build web component
        run: npm run build

      # 5. Bygger Electron-app'en
      - name: Build Electron app
        run: npm run electron:build

      # 6. Pakker Electron-app med electron-builder
      - name: Package Electron app
        run: npx electron-builder --publish never

      # 7. Uploader installer-filer til eksisterende release
      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version }}
          files: |
            release/*.dmg
            release/*.exe
            release/*.AppImage

  # Job 3: Bygger Neutralino-app (ultra letvægt, bygger alle platforme fra Ubuntu)
  build-neutralino:
    needs: create-release
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Build Neutralino app
        run: |
          cd unimark-desktop
          npx @neutralinojs/neu update
          cd ..
          npm run neutralino:build

      - name: List output
        run: ls -la unimark-desktop/dist/unimark/

      - name: Rename binaries for clarity
        run: |
          mv unimark-desktop/dist/unimark/unimark-mac_universal.app unimark-desktop/dist/unimark/UniMark-Neutralino-macOS.app
          mv unimark-desktop/dist/unimark/unimark-win_x64.exe unimark-desktop/dist/unimark/UniMark-Neutralino-Win64.exe
          mv unimark-desktop/dist/unimark/unimark-linux_x64 unimark-desktop/dist/unimark/UniMark-Neutralino-Linux64

      - name: Ad-hoc sign macOS app bundle to prevent SIGKILL
        run: |
          codesign --force --deep --sign - unimark-desktop/dist/unimark/UniMark-Neutralino-macOS.app

      - name: Zip macOS app
        run: |
          cd unimark-desktop/dist/unimark/
          zip -qr UniMark-Neutralino-macOS.zip UniMark-Neutralino-macOS.app

      - name: Upload Neutralino release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version }}
          files: |
            unimark-desktop/dist/unimark/UniMark-Neutralino-macOS.zip
            unimark-desktop/dist/unimark/UniMark-Neutralino-Win64.exe
            unimark-desktop/dist/unimark/UniMark-Neutralino-Linux64
