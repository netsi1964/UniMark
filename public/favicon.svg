<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" rx="112" fill="#12141a"/>
  
  <!-- Opdelerlinje som i appen -->
  <line x1="256" y1="80" x2="256" y2="432" stroke="#374151" stroke-width="4" stroke-dasharray="8 8"/>

  <!-- Venstre side: Rå Markdown Hash -->
  <g stroke="#9CA3AF" stroke-width="20" stroke-linecap="round">
    <line x1="100" y1="220" x2="190" y2="220"/>
    <line x1="90" y1="280" x2="180" y2="280"/>
    <line x1="130" y1="170" x2="100" y2="330"/>
    <line x1="180" y1="170" x2="150" y2="330"/>
  </g>

  <!-- Højre side: Formateret UTF-8 tegn -->
  <text x="360" y="325" 
        font-family="'Times New Roman', Georgia, serif" 
        font-style="italic" 
        font-size="160" 
        font-weight="bold" 
        fill="#A78BFA" 
        text-anchor="middle">U</text>
</svg>